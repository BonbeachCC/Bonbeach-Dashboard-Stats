<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonbeach Cricket Club — Fixtures, Results &amp; Ladder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#000000;
    --panel:#141414;
    --panel-2:#1C1C1C;
    --line:#2B2B2B;
    --white:#FFFFFF;
    --steel:#9A9A9A;
    --red:#DF3E46;
    --red-deep:#8F2126;
    --red-glow:#FF6169;
    --amber:#E8B84B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--black);color:var(--white);}
  body{
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(circle at 15% 0%, rgba(223,62,70,0.12), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(223,62,70,0.06), transparent 40%),
      var(--black);
    min-height:100vh;
  }
  .mono{font-family:'Roboto Mono',monospace;}

  .wrap{max-width:1280px;margin:0 auto;padding:28px 20px 80px;}

  header.top{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
    padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:20px;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .brand h1{
    font-family:'Teko',sans-serif;font-weight:700;letter-spacing:0.5px;
    font-size:34px;line-height:1;margin:0;color:var(--white);
    text-transform:uppercase;
  }
  .brand h1 span{color:var(--red);}
  .brand p{margin:2px 0 0;color:var(--steel);font-size:12.5px;letter-spacing:1.5px;text-transform:uppercase;}
  .updated{color:var(--steel);font-size:12px;text-align:right;}
  .updated b{color:var(--white);display:block;font-size:13px;font-weight:600;}

  .page-nav{margin-bottom:28px;}
  .page-nav a{
    color:var(--steel);font-size:13px;text-decoration:none;font-weight:600;
    border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:inline-block;
    transition:all .15s ease;
  }
  .page-nav a:hover{color:var(--white);border-color:var(--red);}

  .sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .sec-head h2{
    font-family:'Teko',sans-serif;font-size:26px;font-weight:600;text-transform:uppercase;
    letter-spacing:0.5px;margin:0;color:var(--white);
    border-left:4px solid var(--red);padding-left:10px;
  }
  .sec-head .sub{color:var(--steel);font-size:12.5px;}
  section{margin-bottom:40px;}

  .result-card{
    background:linear-gradient(160deg,var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:10px;
    padding:14px 18px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    position:relative;overflow:hidden;
  }
  .result-card::before{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;}
  .result-card.win::before{background:var(--amber);}
  .result-card.loss::before{background:var(--red);}
  .result-card.other::before{background:var(--steel);}
  .result-meta{color:var(--steel);font-size:11px;text-transform:uppercase;letter-spacing:1.1px;margin-bottom:5px;}
  .result-teams{font-size:15.5px;font-weight:700;color:var(--white);}
  .result-teams .score{font-family:'Roboto Mono',monospace;font-weight:500;color:var(--steel);font-size:13px;margin-left:5px;}
  .result-teams .vs{color:var(--steel);font-weight:500;font-size:12px;margin:0 6px;text-transform:uppercase;}
  .result-badge{
    font-family:'Teko',sans-serif;font-size:19px;font-weight:600;letter-spacing:1px;
    padding:4px 16px;border-radius:6px;text-transform:uppercase;white-space:nowrap;
  }
  .result-badge.win{background:rgba(232,184,75,0.15);color:var(--amber);border:1px solid var(--amber);}
  .result-badge.loss{background:rgba(223,62,70,0.15);color:var(--red-glow);border:1px solid var(--red);}
  .result-badge.other{background:rgba(154,154,154,0.12);color:var(--steel);border:1px solid var(--line);}

  .fixture-card{
    background:linear-gradient(160deg,var(--panel) 0%, var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:10px;
    padding:14px 18px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    position:relative;overflow:hidden;
  }
  .fixture-card::before{content:"";position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--red);}
  .fixture-meta{color:var(--steel);font-size:11px;text-transform:uppercase;letter-spacing:1.1px;margin-bottom:5px;}
  .fixture-teams{font-size:15.5px;font-weight:700;color:var(--white);}
  .fixture-teams .vs{color:var(--steel);font-weight:500;font-size:12px;margin:0 6px;text-transform:uppercase;}
  .fixture-venue{color:var(--steel);font-size:11.5px;margin-top:4px;}
  .fixture-when{
    font-family:'Teko',sans-serif;font-size:19px;font-weight:600;letter-spacing:0.5px;
    padding:4px 16px;border-radius:6px;text-transform:uppercase;white-space:nowrap;
    background:rgba(154,154,154,0.12);color:var(--white);border:1px solid var(--line);text-align:center;
  }
  .fixture-when small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;color:var(--steel);text-transform:none;letter-spacing:0;margin-top:1px;}

  .empty-note{color:var(--steel);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px;}

  .ladder-block{margin-bottom:26px;}
  .ladder-block h3{
    font-family:'Teko',sans-serif;font-size:19px;font-weight:600;text-transform:uppercase;
    letter-spacing:0.5px;margin:0 0 10px;color:var(--steel);
  }
  .table-wrap{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .scroll-x{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:520px;}
  thead th{
    background:var(--panel-2);color:var(--steel);font-size:10.5px;text-transform:uppercase;letter-spacing:0.8px;
    text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody tr{border-bottom:1px solid var(--line);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr.bb-row{background:rgba(223,62,70,0.08);}
  tbody td{padding:9px 12px;font-size:13px;white-space:nowrap;}
  td.name-cell{font-weight:600;color:var(--white);}
  tbody tr.bb-row td.name-cell{color:var(--red-glow);}
  td.num{font-family:'Roboto Mono',monospace;color:#D8D8D5;text-align:center;}

  footer{text-align:center;color:var(--steel);font-size:12px;padding-top:20px;}
  footer b{color:var(--white);}

  @media(max-width:640px){
    .brand h1{font-size:26px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div>
        <h1>Bonbeach C.C. <span>Sharks</span></h1>
        <p>Fixtures, Results &amp; Ladder</p>
      </div>
    </div>
    <div class="updated">
      <b id="lastUpdated">—</b>
      Live PlayHQ data — current season
    </div>
  </header>

  <div class="page-nav"><a href="index.html">← Back to Milestone Tracker</a></div>

  <section>
    <div class="sec-head">
      <h2>📅 Upcoming Fixtures</h2>
      <div class="sub" id="fixturesSub"></div>
    </div>
    <div id="fixturesList"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>🏆 Ladder</h2>
      <div class="sub" id="laddersSub"></div>
    </div>
    <div id="laddersList"></div>
  </section>

  <section>
    <div class="sec-head">
      <h2>🏏 Latest Results</h2>
      <div class="sub" id="resultsSub"></div>
    </div>
    <div id="resultsList"></div>
  </section>

  <footer>
    <b>Bonbeach Cricket Club</b> — data via PlayHQ. Updated automatically every day.
  </footer>

</div>

<script>
const DASHBOARD_DATA = __PLAYERS_JSON__;
const LATEST_RESULTS = Array.isArray(DASHBOARD_DATA) ? [] : (DASHBOARD_DATA.latest_results || []);
const UPCOMING_FIXTURES = Array.isArray(DASHBOARD_DATA) ? [] : (DASHBOARD_DATA.upcoming_fixtures || []);
const LADDERS = Array.isArray(DASHBOARD_DATA) ? [] : (DASHBOARD_DATA.ladders || []);

document.getElementById('lastUpdated').textContent = 'Updated __LAST_UPDATED__';

// ---------- upcoming fixtures ----------
document.getElementById('fixturesSub').textContent = UPCOMING_FIXTURES.length
  ? `Next ${UPCOMING_FIXTURES.length} match${UPCOMING_FIXTURES.length===1?'':'es'}`
  : '';

function formatFixtureDate(iso){
  if(!iso) return 'Date TBC';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});
}
function fixtureWhen(iso){
  if(!iso) return 'TBC';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return 'TBC';
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((d - today) / 86400000);
  if(diffDays === 0) return 'Today';
  if(diffDays === 1) return 'Tomorrow';
  if(diffDays > 1 && diffDays < 7) return `In ${diffDays} days`;
  return d.toLocaleDateString('en-AU', {day:'numeric', month:'short'});
}

function renderFixtures(){
  const el = document.getElementById('fixturesList');
  if(!UPCOMING_FIXTURES.length){
    el.innerHTML = `<div class="empty-note">No upcoming fixtures scheduled yet — check back closer to the season.</div>`;
    return;
  }
  el.innerHTML = UPCOMING_FIXTURES.map(fx => `
    <div class="fixture-card">
      <div>
        <div class="fixture-meta">${[fx.bonbeach_team, fx.grade, fx.round].filter(Boolean).join(' · ')}</div>
        <div class="fixture-teams">Bonbeach<span class="vs">vs</span>${fx.opponent}</div>
        ${fx.venue ? `<div class="fixture-venue">📍 ${fx.venue}</div>` : ''}
      </div>
      <div class="fixture-when">${fixtureWhen(fx.date)}<small>${formatFixtureDate(fx.date)}${fx.time ? ' · ' + fx.time : ''}</small></div>
    </div>
  `).join('');
}
renderFixtures();

// ---------- ladder ----------
document.getElementById('laddersSub').textContent = LADDERS.length
  ? `${LADDERS.length} grade${LADDERS.length===1?'':'s'}`
  : '';

function ladderCell(v){
  return (v===null || v===undefined) ? '—' : v;
}

function renderLadders(){
  const el = document.getElementById('laddersList');
  if(!LADDERS.length){
    el.innerHTML = `<div class="empty-note">Ladder not available yet — check back once the season's underway.</div>`;
    return;
  }
  el.innerHTML = LADDERS.map(l => `
    <div class="ladder-block">
      <h3>${l.grade_name || 'Grade'}</h3>
      <div class="table-wrap"><div class="scroll-x">
        <table>
          <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>D</th><th>Pts</th><th>%</th></tr></thead>
          <tbody>
            ${(l.rows || []).map(r => `
              <tr class="${r.is_bonbeach ? 'bb-row' : ''}">
                <td class="num">${ladderCell(r.ranking)}</td>
                <td class="name-cell">${r.team}</td>
                <td class="num">${ladderCell(r.played)}</td>
                <td class="num">${ladderCell(r.won)}</td>
                <td class="num">${ladderCell(r.lost)}</td>
                <td class="num">${ladderCell(r.drawn)}</td>
                <td class="num">${ladderCell(r.points)}</td>
                <td class="num">${ladderCell(r.percentage)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div></div>
    </div>
  `).join('');
}
renderLadders();

// ---------- latest results ----------
document.getElementById('resultsSub').textContent = LATEST_RESULTS.length
  ? `Last ${LATEST_RESULTS.length} completed match${LATEST_RESULTS.length===1?'':'es'}`
  : '';

function resultClass(r){
  if(r.result === 'Won') return 'win';
  if(r.result === 'Lost') return 'loss';
  return 'other';
}
function resultLabel(r){
  return r.result || 'Result TBC';
}
function formatResultDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'});
}

function renderResults(){
  const el = document.getElementById('resultsList');
  if(!LATEST_RESULTS.length){
    el.innerHTML = `<div class="empty-note">No completed match results yet — check back once games start being played.</div>`;
    return;
  }
  el.innerHTML = LATEST_RESULTS.map(r => `
    <div class="result-card ${resultClass(r)}">
      <div>
        <div class="result-meta">${[r.bonbeach_team, r.grade, r.round].filter(Boolean).join(' · ')}${r.date ? ' — ' + formatResultDate(r.date) : ''}</div>
        <div class="result-teams">Bonbeach${r.bonbeach_score ? `<span class="score">${r.bonbeach_score}</span>` : ''}<span class="vs">vs</span>${r.opponent}${r.opponent_score ? `<span class="score">${r.opponent_score}</span>` : ''}</div>
      </div>
      <div class="result-badge ${resultClass(r)}">${resultLabel(r)}</div>
    </div>
  `).join('');
}
renderResults();
</script>
</body>
</html>
